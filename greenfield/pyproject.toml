[project]
name = "greenfieldbot"
version = "0.1.0"
description = "Discord bot for managing the Greenfield game servers"
requires-python = ">=3.11,<3.12"

dependencies = [
    "discord.py",
    "python-dotenv",
    "google-api-core",
    "google-api-python-client",
    "google-cloud-compute",
    "google-cloud-secret-manager",
]

[dependency-groups]
dev = [
    "black",
]
